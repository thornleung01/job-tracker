<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- GitHub Pages cannot set response headers, so the policy is a meta tag. Every host in connect-src is a place this app sends requests to: add one only for a feature that needs it, and list it in public/privacy.html (tests/backup/csp.test.ts checks that). api.anthropic.com is for the optional AI (Convert and Check key), called with the person's own key and only when a button is pressed. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; connect-src 'self' https://gmail.googleapis.com https://graph.microsoft.com https://login.microsoftonline.com https://accounts.google.com https://oauth2.googleapis.com https://boards-api.greenhouse.io https://api.lever.co https://api.eu.lever.co https://api.ashbyhq.com https://jobs.ashbyhq.com https://api.smartrecruiters.com https://api.anthropic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src https://accounts.google.com https://login.microsoftonline.com; base-uri 'self'; form-action 'self'">
<meta name="description" content="Follow your job applications from the emails in your own mailbox. Your data stays in your browser.">
<meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png">
<!-- Installable (Add to home screen), but deliberately no service worker: the app needs the network for mail and job boards, and a worker that caches the bundle could keep serving an old version after a fix. The manifest's paths are relative, so they follow the site's base. -->
<link rel="manifest" href="%BASE_URL%manifest.webmanifest">
<title>Job Tracker</title>
</head>
<body>
<noscript><p style="max-width:720px;margin:0 auto;padding:40px 16px;font:400 1rem/1.4 system-ui,-apple-system,sans-serif">Job Tracker needs JavaScript to run. Nothing is sent from your browser to a Job Tracker server.</p></noscript>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
